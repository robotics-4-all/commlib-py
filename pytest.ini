[pytest]
# Marker definitions for test categorization
markers =
    mqtt: tests that require a running MQTT broker (EMQX)
    redis: tests that require a running Redis broker
    amqp: tests that require a running AMQP broker (RabbitMQ)
    integration: integration tests that require external services
    unit: unit tests that don't require external services
    benchmark: performance benchmark tests (may be slow)
    smoke: quick smoke tests for benchmarks (fast, <30 seconds)

# pytest-benchmark configuration
[tool:pytest]
# Benchmark settings
benchmark_min_rounds = 3
benchmark_max_time = 1.0
benchmark_min_time = 0.000005
benchmark_warmup = true
benchmark_disable_gc = false
benchmark_sort = mean
benchmark_columns = min, max, mean, stddev, median, ops, rounds
benchmark_histogram = true

# Save benchmark results to .benchmarks directory
benchmark_storage = file://.benchmarks
benchmark_json = true
benchmark_autosave = true

# Comparison settings
benchmark_compare = mean
benchmark_compare_fail = mean:10%
