name: Benchmarks

on:
  push:
    branches: [ "devel", "master"]
  pull_request:
    branches: [ "devel", "master" ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of benchmark tests to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
          - all

permissions:
  contents: read

jobs:
  benchmark-smoke:
    name: Benchmark Smoke Tests
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_type == 'smoke' || github.event.inputs.test_type == 'all'))
    
    strategy:
      matrix:
        python-version: ["3.11"]
      max-parallel: 1
    
    services:
      mosquitto:
        image: eclipse-mosquitto:latest
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -t 'test' -E -i 'test' -W 1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install .[dev]
      
      - name: Wait for services
        run: |
          echo "Waiting for MQTT broker..."
          timeout 30 bash -c 'until nc -z localhost 1883; do sleep 1; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'
          echo "Waiting for RabbitMQ..."
          timeout 30 bash -c 'until nc -z localhost 5672; do sleep 1; done'
          sleep 5
      
      - name: Run benchmark smoke tests
        run: |
          pytest tests/benchmarks/ -v -m smoke --tb=short
        env:
          COMMLIB_MQTT_HOST: localhost
          COMMLIB_MQTT_PORT: 1883
          COMMLIB_REDIS_HOST: localhost
          COMMLIB_REDIS_PORT: 6379
          COMMLIB_AMQP_HOST: localhost
          COMMLIB_AMQP_PORT: 5672
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            .coverage
            .pytest_cache/
          retention-days: 7

  benchmark-full:
    name: Full Benchmark Tests (Nightly)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_type == 'full' || github.event.inputs.test_type == 'all'))
    
    strategy:
      matrix:
        python-version: ["3.11"]
        transport: ["mqtt", "redis", "amqp"]
      max-parallel: 3
    
    services:
      mosquitto:
        image: eclipse-mosquitto:latest
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -t 'test' -E -i 'test' -W 1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install .[dev]
      
      - name: Wait for services
        run: |
          echo "Waiting for MQTT broker..."
          timeout 30 bash -c 'until nc -z localhost 1883; do sleep 1; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'
          echo "Waiting for RabbitMQ..."
          timeout 30 bash -c 'until nc -z localhost 5672; do sleep 1; done'
          sleep 5
      
      - name: Run ${{ matrix.transport }} benchmark tests
        run: |
          pytest tests/benchmarks/test_bench_${{ matrix.transport }}.py -v --tb=short
        env:
          COMMLIB_MQTT_HOST: localhost
          COMMLIB_MQTT_PORT: 1883
          COMMLIB_REDIS_HOST: localhost
          COMMLIB_REDIS_PORT: 6379
          COMMLIB_AMQP_HOST: localhost
          COMMLIB_AMQP_PORT: 5672
      
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.transport }}-${{ matrix.python-version }}
          path: |
            .coverage
            .pytest_cache/
          retention-days: 30

  benchmark-report:
    name: Generate Benchmark Report
    runs-on: ubuntu-latest
    needs: [benchmark-smoke]
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Generate summary
        run: |
          echo "# Benchmark Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Smoke Tests" >> $GITHUB_STEP_SUMMARY
          if [ -d "artifacts/smoke-test-results" ]; then
            echo "✅ Smoke tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Smoke tests failed or not run" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
